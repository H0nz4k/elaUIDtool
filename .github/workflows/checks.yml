name: Tests and Windows GUI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_version.py
      - run: python scripts/test_registration_firmware.py

  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -e . -r gui/requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean elaUIDtool.spec
      - name: Verify bundled templates, images and running GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = 'dist/elaUIDtool/_internal'
          foreach ($file in @(
            'elatec_uid_tool/fw_templates/registration/App_D2R_DualRegistration.c',
            'assets/readers/twn4-multitech-2-usb.jpg',
            'assets/readers/twn4-multitech-3-m-lf-hf.png'
          )) {
            if (!(Test-Path "$data/$file")) { throw "Missing bundled file: $file" }
          }
          $process = Start-Process 'dist/elaUIDtool/elaUIDtool.exe' -ArgumentList '--browser','--port','8765' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8765/' -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Contains('Registrace HF/LF')) {
                  $ready = $true
                  break
                }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw 'Packaged GUI did not start or did not render registration' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elaUIDtool-win64-gui
          path: dist/elaUIDtool/
          retention-days: 30
          if-no-files-found: error
